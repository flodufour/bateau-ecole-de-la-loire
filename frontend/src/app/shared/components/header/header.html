<header class="header">
  <div class="header__inner container">
    <a class="header__brand" routerLink="/">École de bateau de la Loire</a>

    <nav class="header__nav" aria-label="Navigation principale">
      <a routerLink="/formations" routerLinkActive="header__nav-link--active">Formations</a>
      <a routerLink="/contact" routerLinkActive="header__nav-link--active">Contact</a>
      @if (currentUser(); as user) {
        <a routerLink="/reserver" routerLinkActive="header__nav-link--active">Réserver</a>
        <a routerLink="/mon-espace" routerLinkActive="header__nav-link--active">Mon espace</a>
        @if (user.role === 'Admin') {
          <a routerLink="/admin" routerLinkActive="header__nav-link--active">Admin</a>
        }
      }
    </nav>

    <nav class="header__actions" aria-label="Compte">
      @if (currentUser(); as user) {
        <span class="header__user">{{ user.firstName }}</span>
        <button type="button" class="link-button" (click)="logout()">Se déconnecter</button>
      } @else {
        <a routerLink="/connexion">Se connecter</a>
        <a class="header__cta" routerLink="/inscription">S'inscrire</a>
      }
    </nav>
  </div>
</header>
