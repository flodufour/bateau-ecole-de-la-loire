<section class="auth-page container">
  <div class="auth-card">
    <h1>Créer un compte</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <label class="field">
        <span>Prénom</span>
        <input type="text" formControlName="firstName" autocomplete="given-name" />
      </label>

      <label class="field">
        <span>Nom</span>
        <input type="text" formControlName="lastName" autocomplete="family-name" />
      </label>

      <label class="field">
        <span>Email</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <small class="field__error">Adresse email invalide.</small>
        }
      </label>

      <label class="field">
        <span>Mot de passe</span>
        <input type="password" formControlName="password" autocomplete="new-password" />
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <small class="field__error">8 caractères minimum.</small>
        }
      </label>

      @if (errors().length) {
        <ul class="form-errors">
          @for (error of errors(); track error) {
            <li>{{ error }}</li>
          }
        </ul>
      }

      <button type="submit" class="submit-button" [disabled]="submitting()">
        {{ submitting() ? 'Création…' : 'Créer mon compte' }}
      </button>
    </form>

    <p class="auth-card__footer">
      Déjà un compte ? <a routerLink="/connexion">Se connecter</a>
    </p>
  </div>
</section>
