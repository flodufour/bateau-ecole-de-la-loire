<section class="auth-page container">
  <div class="auth-card">
    <h1>Nouveau mot de passe</h1>

    @if (linkInvalid) {
      <p>Ce lien de réinitialisation est invalide ou incomplet.</p>
      <p class="auth-card__footer">
        <a routerLink="/mot-de-passe-oublie">Demander un nouveau lien</a>
      </p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="field">
          <span>Nouveau mot de passe</span>
          <input type="password" formControlName="newPassword" autocomplete="new-password" />
          @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
            <small class="field__error">8 caractères minimum.</small>
          }
        </label>

        @if (errors().length) {
          <ul class="form-errors">
            @for (error of errors(); track error) {
              <li>{{ error }}</li>
            }
          </ul>
        }

        <button type="submit" class="submit-button" [disabled]="submitting()">
          {{ submitting() ? 'Enregistrement…' : 'Réinitialiser le mot de passe' }}
        </button>
      </form>
    }
  </div>
</section>
